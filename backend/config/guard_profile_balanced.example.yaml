# Copy to guard_profile_balanced.yaml (gitignored) and adjust before running Helio.
# "Balanced" risk preference — this is also GATE 3's original single default
# policy (backend/config/guard_config.example.yaml), preserved unchanged so
# "balanced" always matches what Gate 3 shipped with.
# The hard-invariant fields below MUST be identical across all three
# guard_profile_* files — build_app_state() asserts this at startup.

policy_version: guard_v1

allowed_symbols:
  - BTC-USDT
allowed_instrument_types:
  - SPOT
max_leverage: 1.0
allowed_sides:
  - buy
max_simultaneous_positions: 1

max_notional_per_trade_usd: 100.0
max_daily_loss_usd: 50.0
max_portfolio_exposure_pct: 20.0
min_risk_reward: 1.5
min_confidence: 0.6

max_market_data_age_seconds: 900
max_account_state_age_seconds: 900

lot_size: "0.00000001"
min_size: "0.00001"
