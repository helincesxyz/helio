[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helio"
version = "0.1.0"
description = "Deterministic risk/strategy/learning engines for LLM-assisted OKX trading, orchestrated by Claude Code via the OKX Agent Trade Kit MCP server."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[project.scripts]
helio = "helio.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/helio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
